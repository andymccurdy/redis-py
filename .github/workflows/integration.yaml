name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.rst'
      - '**/*.md'
    branches:
      - master
      - '[0-9].[0-9]'
  pull_request:
    branches:
      - master
      - '[0-9].[0-9]'
  schedule:
    - cron: '0 1 * * *' # nightly build

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-integration
  cancel-in-progress: true

permissions:
  contents: read  #  to fetch code (actions/checkout)

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  # this speeds up coverage with Python 3.12: https://github.com/nedbat/coveragepy/issues/1665
  COVERAGE_CORE: sysmon
  # patch releases get included in the base version image when they are published
  # for example after 8.2.1 is published, 8.2 image contains 8.2.1 content
  CURRENT_REDIS_VERSION: '8.10.3'
  REDIS_VERSION_CUSTOM_MAP: >-
    8.12.0:custom-40894365660-debian

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: dev_requirements.txt
          ignore-vulns: |
            GHSA-w596-4wvx-j9j6  # subversion related git pull, dependency for pytest. There is no impact here.
            CVE-2026-34073 # DNS name constraints were validated only against SANs, not against the peer name used in verification
                           # Update version when msal dependency in entraid is updated
            CVE-2026-4539  # pygments ReDoS in AdlLexer, local access only, no fix available yet

  lint:
    name: Code linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: run code linters
        run: |
          pip install -r dev_requirements.txt
          pip uninstall -y redis  # uninstall Redis package installed via redis-entraid
          invoke linters

  redis_version:
    runs-on: ubuntu-latest
    outputs:
      CURRENT: ${{ env.CURRENT_REDIS_VERSION }}
    steps:
      - name: Compute outputs
        run: |
          echo "CURRENT=${{ env.CURRENT_REDIS_VERSION }}" >> $GITHUB_OUTPUT

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: redis_version
    strategy:
      max-parallel: 30
      fail-fast: false
      matrix:
        # Pull requests test the preview, current, two previous releases and oldest supported Redis versions.
        # Pushes and the nightly build test every supported version.
        redis-version: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && format('["8.12.0", "{0}", "8.8.4", "8.6.8", "7.2.14"]', needs.redis_version.outputs.CURRENT)
          || format('["8.12.0", "{0}", "8.8.4", "8.6.8", "8.4.8", "8.2.11", "8.0.6", "7.4.9", "7.2.14"]', needs.redis_version.outputs.CURRENT)) }}
        python-version: ['3.11', '3.15']
        parser-backend: ['plain']
        event-loop: ['asyncio']
        # One job per protocol and response shape, running the standalone and
        # the cluster tests; the fixed client tests run in the
        # default-legacy_responses job (see run-fixed-clients and the job name).
        test-config:
          - default-legacy_responses
          - default-unified_responses
          - 2-legacy_responses
          - 2-unified_responses
          - 3-legacy_responses
          - 3-unified_responses
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    name: Redis ${{ matrix.redis-version }}; Python ${{ matrix.python-version }}; RESP Parser:${{matrix.parser-backend}}; EL:${{matrix.event-loop}}; Config:${{matrix.test-config}}${{ matrix.test-config == 'default-legacy_responses' && ' + fixed-clients' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
            python-version: ${{ matrix.python-version }}
            parser-backend: ${{ matrix.parser-backend }}
            redis-version: ${{ matrix.redis-version }}
            test-config: ${{ matrix.test-config }}
            run-fixed-clients: ${{ matrix.test-config == 'default-legacy_responses' && 'true' || 'false' }}
            # Fold the MultiDBClient (active-active) integration tests into an
            # existing matrix cell instead of a dedicated job, so no extra CI
            # runners are added. Run them once, on the current Redis version's
            # default-unified_responses cell.
            run-multidb-integration: ${{ (matrix.redis-version == needs.redis_version.outputs.CURRENT && matrix.test-config == 'default-unified_responses') && 'true' || 'false' }}

  python-compatibility-tests:
    runs-on: ubuntu-latest
    needs: [ redis_version ]
    timeout-minutes: 60
    strategy:
      max-parallel: 30
      fail-fast: false
      matrix:
        redis-version: [ '${{ needs.redis_version.outputs.CURRENT }}' ]
        python-version: ['3.11', '3.12', '3.13']
        parser-backend: [ 'plain' ]
        event-loop: [ 'asyncio' ]
        # One job per protocol and response shape, running the standalone and
        # the cluster tests; the fixed client tests run in the
        # default-legacy_responses job (see run-fixed-clients and the job name).
        test-config:
          - default-legacy_responses
          - default-unified_responses
          - 2-legacy_responses
          - 2-unified_responses
          - 3-legacy_responses
          - 3-unified_responses
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    name: Redis ${{ matrix.redis-version }}; Python ${{ matrix.python-version }}; RESP Parser:${{matrix.parser-backend}}; EL:${{matrix.event-loop}}; Config:${{matrix.test-config}}${{ matrix.test-config == 'default-legacy_responses' && ' + fixed-clients' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          python-version: ${{ matrix.python-version }}
          parser-backend: ${{ matrix.parser-backend }}
          redis-version: ${{ matrix.redis-version }}
          test-config: ${{ matrix.test-config }}
          run-fixed-clients: ${{ matrix.test-config == 'default-legacy_responses' && 'true' || 'false' }}

  pypy-compatibility-tests:
    runs-on: ubuntu-latest
    needs: [ redis_version ]
    # PyPy jobs sometimes hang, and the timeout ends them. Each job runs the
    # standalone and cluster tests in about 10 minutes, so the limit leaves room
    # to grow.
    timeout-minutes: 60
    strategy:
      max-parallel: 30
      fail-fast: false
      matrix:
        redis-version: [ '${{ needs.redis_version.outputs.CURRENT }}' ]
        python-version: ['pypy-3.11']
        parser-backend: [ 'plain' ]
        event-loop: [ 'asyncio' ]
        # One job per protocol and response shape, running the standalone and
        # the cluster tests; the fixed client tests run in the
        # default-legacy_responses job (see run-fixed-clients and the job name).
        test-config:
          - default-legacy_responses
          - default-unified_responses
          - 2-legacy_responses
          - 2-unified_responses
          - 3-legacy_responses
          - 3-unified_responses
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    name: PyPy Redis ${{ matrix.redis-version }}; ${{ matrix.python-version }}; RESP Parser:${{matrix.parser-backend}}; EL:${{matrix.event-loop}}; Config:${{matrix.test-config}}${{ matrix.test-config == 'default-legacy_responses' && ' + fixed-clients' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          python-version: ${{ matrix.python-version }}
          parser-backend: ${{ matrix.parser-backend }}
          redis-version: ${{ matrix.redis-version }}
          test-config: ${{ matrix.test-config }}
          run-fixed-clients: ${{ matrix.test-config == 'default-legacy_responses' && 'true' || 'false' }}

  hiredis-tests:
    runs-on: ubuntu-latest
    needs: [redis_version]
    timeout-minutes: 60
    strategy:
      max-parallel: 30
      fail-fast: false
      matrix:
        redis-version: [ '${{ needs.redis_version.outputs.CURRENT }}' ]
        python-version: [ '3.11', '3.15']
        parser-backend: [ 'hiredis' ]
        hiredis-version: [ '>=3.2.0', '<3.0.0' ]
        event-loop: [ 'asyncio' ]
        # One job per protocol and response shape, running the standalone and
        # the cluster tests; the fixed client tests run in the
        # default-legacy_responses job (see run-fixed-clients and the job name).
        test-config:
          - default-legacy_responses
          - default-unified_responses
          - 2-legacy_responses
          - 2-unified_responses
          - 3-legacy_responses
          - 3-unified_responses
        # hiredis 2.x has no Python 3.15 wheel, and its setup.py does not
        # build on Python 3.15.
        exclude:
          - python-version: '3.15'
            hiredis-version: '<3.0.0'
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    name: Redis ${{ matrix.redis-version }}; Python ${{ matrix.python-version }}; RESP Parser:${{matrix.parser-backend}} (${{ matrix.hiredis-version }}); EL:${{matrix.event-loop}}; Config:${{matrix.test-config}}${{ matrix.test-config == 'default-legacy_responses' && ' + fixed-clients' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          python-version: ${{ matrix.python-version }}
          parser-backend: ${{ matrix.parser-backend }}
          redis-version: ${{ matrix.redis-version }}
          hiredis-version: ${{ matrix.hiredis-version }}
          test-config: ${{ matrix.test-config }}
          run-fixed-clients: ${{ matrix.test-config == 'default-legacy_responses' && 'true' || 'false' }}

  uvloop-tests:
    runs-on: ubuntu-latest
    needs: [redis_version]
    timeout-minutes: 60
    strategy:
      max-parallel: 30
      fail-fast: false
      matrix:
        redis-version: [ '${{ needs.redis_version.outputs.CURRENT }}' ]
        python-version: [ '3.11', '3.15' ]
        parser-backend: [ 'plain' ]
        event-loop: [ 'uvloop' ]
        # One job per protocol and response shape, running the standalone and
        # the cluster tests; the fixed client tests run in the
        # default-legacy_responses job (see run-fixed-clients and the job name).
        test-config:
          - default-legacy_responses
          - default-unified_responses
          - 2-legacy_responses
          - 2-unified_responses
          - 3-legacy_responses
          - 3-unified_responses
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    name: Redis ${{ matrix.redis-version }}; Python ${{ matrix.python-version }}; RESP Parser:${{matrix.parser-backend}}; EL:${{matrix.event-loop}}; Config:${{matrix.test-config}}${{ matrix.test-config == 'default-legacy_responses' && ' + fixed-clients' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          python-version: ${{ matrix.python-version }}
          parser-backend: ${{ matrix.parser-backend }}
          redis-version: ${{ matrix.redis-version }}
          event-loop: ${{ matrix.event-loop }}
          test-config: ${{ matrix.test-config }}
          run-fixed-clients: ${{ matrix.test-config == 'default-legacy_responses' && 'true' || 'false' }}

  build-and-test-package:
    name: Validate building and installing the package
    runs-on: ubuntu-latest
    needs: [redis_version]
    strategy:
      fail-fast: false
      matrix:
        extension: ['tar.gz', 'whl']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run installed unit tests
        env:
          CLIENT_LIBS_TEST_IMAGE_TAG: ${{ env.CURRENT_REDIS_VERSION }}
          CLIENT_LIBS_TEST_STACK_IMAGE_TAG: ${{ env.CURRENT_REDIS_VERSION }}
        run: |
          bash .github/workflows/install_and_test.sh ${{ matrix.extension }}

  install-package-from-commit:
    name: Install package from commit hash
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15', 'pypy-3.11']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: install from pip
        run: |
          pip install --quiet git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git@${GITHUB_SHA}
