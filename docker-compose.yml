---
x-client-libs-stack-image: &client-libs-stack-image
  image: "redislabs/client-libs-test:${CLIENT_LIBS_TEST_STACK_IMAGE_TAG:-8.10.3}"

x-client-libs-image: &client-libs-image
  image: "redislabs/client-libs-test:${CLIENT_LIBS_TEST_IMAGE_TAG:-8.10.3}"

networks:
  redis-net:
    driver: bridge
services:

  redis:
    <<: *client-libs-image
    container_name: redis-standalone
    environment:
      - TLS_ENABLED=yes
      - TLS_CLIENT_CNS=test_user
      - REDIS_CLUSTER=no
      - PORT=6379
      - TLS_PORT=6666
    command: ${REDIS_EXTRA_ARGS:---enable-debug-command yes --enable-module-command yes --tls-auth-clients optional --save "" --unixsocket /redis/work/redis.sock --unixsocketperm 777}
    ports:
      - 6379:6379
      - 6666:6666 # TLS port
    volumes:
      - "./dockers/standalone:/redis/work"
    profiles:
      - standalone
      - sentinel
      - replica
      - all-stack
      - all
      - multidb

  replica:
    <<: *client-libs-image
    container_name: redis-replica
    depends_on:
      - redis
    environment:
      - TLS_ENABLED=no
      - REDIS_CLUSTER=no
      - PORT=6380
    command: ${REDIS_EXTRA_ARGS:---enable-debug-command yes --replicaof redis 6379 --protected-mode no --save ""}
    ports:
      - 6380:6380
    volumes:
      - "./dockers/replica:/redis/work"
    profiles:
      - replica
      - all-stack
      - all

  cluster:
    <<: *client-libs-image
    container_name: redis-cluster
    environment:
      - REDIS_CLUSTER=yes
      - NODES=6
      - REPLICAS=1
      - TLS_ENABLED=yes
      - TLS_CLIENT_CNS=test_user
      - PORT=16379
      - TLS_PORT=27379
    command: ${REDIS_EXTRA_ARGS:---enable-debug-command yes --enable-module-command yes --tls-auth-clients optional --save "" --tls-cluster yes}
    ports:
      - "16379-16384:16379-16384"
      - "27379-27384:27379-27384"
    volumes:
      - "./dockers/cluster:/redis/work"
    # The cluster bus ports (data port + 21000, 37379-37384) fall inside the
    # kernel's default ephemeral range, so an outgoing connection made while
    # the nodes start (e.g. a readiness probe) can take one first and the
    # node aborts with "Address already in use". Start the ephemeral range
    # above every port the nodes listen on.
    sysctls:
      - net.ipv4.ip_local_port_range=40000 60999
    profiles:
      - cluster
      - all-stack
      - all
      - multidb

  # Second, independent cluster on shifted ports. Used together with `cluster`
  # by the multi-database (active-active) integration tests so a MultiDBClient
  # can front two real clusters. Each node announces 127.0.0.1:<port>, so host
  # ports are mapped 1:1; the cluster bus port (data port + 21000) stays
  # internal to the container. Only part of the dedicated `multidb` profile so
  # the regular `all` / `all-stack` test runs are not burdened with a second
  # cluster.
  cluster2:
    <<: *client-libs-image
    container_name: redis-cluster-2
    environment:
      - REDIS_CLUSTER=yes
      - NODES=6
      - REPLICAS=1
      - TLS_ENABLED=yes
      - TLS_CLIENT_CNS=test_user
      - PORT=16385
      - TLS_PORT=27385
    command: ${REDIS_EXTRA_ARGS:---enable-debug-command yes --enable-module-command yes --tls-auth-clients optional --save "" --tls-cluster yes}
    ports:
      - "16385-16390:16385-16390"
      - "27385-27390:27385-27390"
    volumes:
      - "./dockers/cluster2:/redis/work"
    # Keeps the bus ports (37385-37390) out of the ephemeral range, as for
    # `cluster` above.
    sysctls:
      - net.ipv4.ip_local_port_range=40000 60999
    # Report healthy only once the cluster has actually formed
    # (cluster_state:ok), so `docker compose up --wait` blocks until the cluster
    # is usable rather than just until the container is running.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 16385 cluster info | grep -q cluster_state:ok"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    profiles:
      - multidb

  sentinel:
    <<: *client-libs-image
    container_name: redis-sentinel
    depends_on:
      - redis
    environment:
      - REDIS_CLUSTER=no
      - NODES=3
      - PORT=26379
    command: ${REDIS_EXTRA_ARGS:---sentinel}
    ports:
      - 26379:26379
      - 26380:26380
      - 26381:26381
    volumes:
      - "./dockers/sentinel.conf:/redis/config-default/redis.conf"
      - "./dockers/sentinel:/redis/work"
    profiles:
      - sentinel
      - all-stack
      - all

  redis-stack:
    <<: *client-libs-stack-image
    container_name: redis-stack
    environment:
      - REDIS_CLUSTER=no
      - PORT=6379
    command: ${REDIS_EXTRA_ARGS:---enable-debug-command yes --enable-module-command yes --save ""}
    ports:
      - 6479:6379
    volumes:
      - "./dockers/redis-stack:/redis/work"
    profiles:
      - standalone
      - all-stack
      - all
      - multidb

  redis-proxied:
    <<: *client-libs-image
    container_name: redis-proxied
    ports:
      - "3000:3000"
    networks:
      - redis-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "3000", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5

  resp-proxy:
    image: redislabs/client-resp-proxy
    container_name: resp-proxy
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "15379,15380,15381"
      TARGET_HOST: "redis-proxied"
      TARGET_PORT: "3000"
      API_PORT: "4000"
      ENABLE_LOGGING: true
      SIMULATE_CLUSTER: true
      DEFAULT_INTERCEPTORS: "cluster,hitless,logger"

    ports:
      - "15379:15379"
      - "15380:15380"
      - "15381:15381"
      - "4000:4000"
    depends_on:
      - redis-proxied
    networks:
      - redis-net
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:4000/stats || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
